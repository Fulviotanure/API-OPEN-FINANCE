name: Build and Release Pluggy Explorer

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter requests pillow pyinstaller

      - name: Compile Executable with PyInstaller
        run: |
          python -m PyInstaller --noconsole --onefile --icon="app_icon.ico" --name="PluggyExplorer" --collect-all customtkinter app_explorer.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PluggyExplorer-Windows
          path: dist/PluggyExplorer.exe

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.0' }}
          name: Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/PluggyExplorer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
